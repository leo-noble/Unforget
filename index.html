<!doctype html>
<html lang="en" data-mode="light" data-accent="indigo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Retavo — Keep what you learn</title>
    <meta name="description" content="Retavo schedules every chapter you study for five spaced reviews and tells you exactly what to revise each day." />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Installed to the Home Screen: full-screen, its own name under the icon,
         and a status bar that takes the page's own background colour. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Retavo" />
    <meta name="application-name" content="Retavo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />

    <script>
      // Paint the first frame in the user's own appearance. Mirrors
      // resolveAccent/resolveMode in src/lib/appearance.js — keep them in step.
      (function () {
        var root = document.documentElement
        var ACCENTS = ['indigo', 'blue', 'teal', 'green', 'orange', 'pink', 'purple']
        var LEGACY = { slate: 'indigo', aurora: 'purple', forest: 'green', linen: 'green', fog: 'indigo', graphite: 'indigo', verdant: 'green' }
        var accent = 'indigo'
        var mode = 'system'
        try {
          var boot = JSON.parse(localStorage.getItem('retavo.appearance') || 'null')
          var prefs = boot || JSON.parse(localStorage.getItem('cadence.prefs') || '{}')
          var a = boot ? boot.accent : prefs.theme
          accent = ACCENTS.indexOf(a) >= 0 ? a : LEGACY[a] || 'indigo'
          mode = (boot ? boot.themeMode : prefs.themeMode) || 'system'
          if (!boot && (prefs.theme === 'graphite' || prefs.theme === 'verdant')) mode = 'dark'
        } catch (e) {}
        if (mode !== 'light' && mode !== 'dark') {
          mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        root.dataset.accent = accent
        root.dataset.mode = mode
        root.style.colorScheme = mode
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', mode === 'dark' ? '#000000' : '#F2F2F7')
          metas[i].removeAttribute('media')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
