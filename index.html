<!doctype html>
      <html lang="en" data-mode="dark" data-theme-mode="dark" data-accent="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Unforget — Remember what you study</title>
    <meta name="description" content="Unforget schedules every chapter you study for five spaced reviews and tells you exactly what to revise each day." />

    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Installed to the Home Screen: full-screen edge to edge. black-translucent
         lets the app draw under the status bar and Dynamic Island instead of
         iOS painting a solid bar there; every top edge pads by
         env(safe-area-inset-top) to clear it. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Unforget" />
    <meta name="application-name" content="Unforget" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#101110" />

    <script>
      // Paint the first frame in the user's own appearance. Mirrors
      // resolveAccent/resolveMode in src/lib/appearance.js — keep them in step.
      (function () {
        var root = document.documentElement
        var ACCENTS = ['graphite', 'indigo', 'blue', 'teal', 'green', 'orange', 'pink', 'purple']
        var LEGACY = { slate: 'graphite', aurora: 'purple', forest: 'green', linen: 'green', fog: 'graphite', graphite: 'graphite', red: 'graphite', verdant: 'green' }
        var accent = 'graphite'
        var themeMode = 'dark'
        try {
          var boot = JSON.parse(localStorage.getItem('unforget.appearance') || 'null')
          var prefs = boot || JSON.parse(localStorage.getItem('cadence.prefs') || '{}')
          var a = boot ? boot.accent : prefs.theme
          themeMode = boot ? boot.themeMode : prefs.themeMode
          if ((boot ? boot.appearanceVersion : prefs.appearanceVersion) !== 1 && (!themeMode || themeMode === 'system')) {
            themeMode = 'dark'
          }
          accent = ACCENTS.indexOf(a) >= 0 ? a : LEGACY[a] || 'graphite'
        } catch (e) {}
        if (['light', 'dark', 'system'].indexOf(themeMode) < 0) themeMode = 'dark'
        var mode = themeMode === 'system'
          ? (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
          : themeMode
        root.dataset.accent = accent
        root.dataset.themeMode = themeMode
        root.dataset.mode = mode
        root.style.colorScheme = mode
        var metas = document.querySelectorAll('meta[name="theme-color"]')
        for (var i = 0; i < metas.length; i++) {
          metas[i].setAttribute('content', mode === 'dark' ? '#101110' : '#F3F3F1')
          metas[i].removeAttribute('media')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
